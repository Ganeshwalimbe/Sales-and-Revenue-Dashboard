<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2d1b69; color: #1e293b; margin: 0; padding: 0; }
        .card { background: white; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); padding: 1rem; }
        .kpi-card { background: white; border-radius: 4px; border-left: 6px solid #8b5cf6; padding: 10px 15px; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
        .chart-container { position: relative; height: 320px; width: 100%; }
        .small-chart { position: relative; height: 160px; width: 100%; }
        .sticky-nav { position: sticky; top: 0; z-index: 1000; background: #2d1b69; border-bottom: 1px solid #4c1d95; padding: 1rem 2rem; }
        select { background: #4c1d95; color: white; border: 1px solid #7c3aed; border-radius: 4px; padding: 4px 12px; font-weight: bold; cursor: pointer; }
        .nav-btn { background: #6d28d9; color: white; padding: 8px 18px; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background: #7c3aed; }
        .nav-btn:disabled { background: #4c1d95; opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <nav class="sticky-nav flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="bg-white px-8 py-2 rounded shadow-md">
            <h1 id="pageTitle" class="text-xl font-bold text-indigo-900 uppercase tracking-wide">Sales Overview</h1>
        </div>

        <div class="flex items-center gap-4 bg-indigo-950 p-2 rounded-lg border border-indigo-800">
            <button id="prevBtn" onclick="changePage(-1)" class="nav-btn">PREV</button>
            <div class="text-white font-semibold flex items-center gap-2">
                <span class="opacity-70 text-xs">PAGE</span>
                <select id="pageSelect" onchange="jumpToPage(this.value)"></select>
                <span class="opacity-70 text-xs">OF 11</span>
            </div>
            <button id="nextBtn" onclick="changePage(1)" class="nav-btn">NEXT</button>
        </div>
    </nav>

    <main id="mainContent" class="p-4 md:p-8 space-y-6 max-w-[1600px] mx-auto">
        <!-- Content injected by JS -->
    </main>

<script>
    Chart.register(ChartDataLabels);

    let currentPage = 1;
    const totalPages = 11;
    let charts = [];

    const colors = {
        act: '#00aaff',    // Bright Blue
        bud: '#a855f7',    // Purple
        ly: '#fb7185',     // Rose
        fc: '#22d3ee',     // Forecast Cyan
        diff: '#f59e0b',   // Variance Orange
        bars: ['#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e', '#fb7185', '#0ea5e9', '#10b981', '#f59e0b']
    };

    const labels = {
        months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        skus: ['NOCON', 'SALTED140', 'SALTED35', 'SESAME35', 'CHILLI140', 'SOUR140', 'NOBAN', 'CHILLI35', 'SOUR35C', 'SALTED35C'],
        customers: ['Client 01', 'Client 02', 'Client 03', 'Client 04', 'Client 05', 'Client 16', 'Client 80', 'Client 90', 'Client 15', 'Client 76']
    };

    function clear() {
        charts.forEach(c => c.destroy());
        charts = [];
        document.getElementById('mainContent').innerHTML = '';
    }

    function kpi(title, val, neg = false) {
        return `<div class="kpi-card shadow-lg">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">${title}</div>
            <div class="text-xl font-black ${neg ? 'text-rose-600' : 'text-indigo-900'}">${val}</div>
        </div>`;
    }

    // --- CHART ENGINE ---
    function addChart(id, type, data, options = {}) {
        const ctx = document.getElementById(id).getContext('2d');
        const config = {
            type: type,
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } },
                    datalabels: {
                        anchor: 'end', align: 'end', color: '#444', font: { weight: 'bold', size: 9 },
                        formatter: v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : (v >= 1000 ? (v/1000).toFixed(1)+'k' : v)
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 9 } } }
                },
                ...options
            }
        };
        charts.push(new Chart(ctx, config));
    }

    // --- PAGES ---
    const pageData = [
        { title: "Sales Overview", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">${kpi("Total Sales", "£4.38M")}${kpi("Units Sold", "7,062,382")}${kpi("Customer Inv.", "£268.02K")}${kpi("Sales vs Bud", "-18.80%", true)}${kpi("Units vs Bud", "-12.18%", true)}${kpi("Inv vs Bud", "-53.27%", true)}</div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card"><h3 class="font-bold text-xs mb-4">Top 10 SKU</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Sales By Channel</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Top 10 Customers</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Monthly Sales</h3><div class="chart-container"><canvas id="c4"></canvas></div></div>
            </div>`;
            addChart('c1', 'bar', { labels: labels.skus, datasets: [{ label: 'Rev', data: [516, 511, 507, 322, 257, 189, 187, 175, 170, 166], backgroundColor: colors.act }] }, { indexAxis: 'y' });
            addChart('c2', 'pie', { labels: ['Grocery', 'Travel', 'Export', 'Ecommerce', 'Other'], datasets: [{ data: [21, 11, 10, 9, 49], backgroundColor: colors.bars }] });
            addChart('c3', 'bar', { labels: labels.customers, datasets: [{ label: 'Rev', data: [391, 383, 244, 213, 209, 185, 174, 164, 134, 130], backgroundColor: colors.bud }] }, { indexAxis: 'y' });
            addChart('c4', 'bar', { labels: labels.months, datasets: [{ label: 'Sales', data: [309, 213, 349, 207, 426, 282, 409, 149, 243, 232, 154, 162], backgroundColor: colors.act }] });
        }},
        { title: "Sales Insights", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card"><h3 class="font-bold text-xs mb-4">Channel Distribution</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Product Contribution</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Top 12 Accounts</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Bottom 12 Accounts</h3><div class="chart-container"><canvas id="c4"></canvas></div></div>
            </div>`;
            addChart('c1', 'doughnut', { labels: ['Grocery', 'Foodservice', 'Travel', 'Wholesale', 'Other'], datasets: [{ data: [21, 14, 11, 10, 44], backgroundColor: colors.bars }] });
            addChart('c2', 'bar', { labels: labels.skus, datasets: [{ label: 'Rev', data: [516, 322, 257, 189, 170, 121, 100, 77, 64, 41], backgroundColor: colors.bud }] });
            addChart('c3', 'bar', { labels: [...labels.customers, 'C11', 'C12'], datasets: [{ label: 'Rev', data: [391, 383, 244, 213, 210, 185, 174, 164, 134, 130, 122, 121], backgroundColor: colors.act }] }, { indexAxis: 'y' });
            addChart('c4', 'bar', { labels: ['Bot 1', 'Bot 2', 'Bot 3', 'Bot 4', 'Bot 5'], datasets: [{ label: 'Rev', data: [2.4, 2.3, 2.2, 2.1, 1.7], backgroundColor: '#ef4444' }] }, { indexAxis: 'y' });
        }},
        { title: "Drivers & Drainers By Units", render: (area) => {
            area.innerHTML = `<div class="card mb-6"><h3 class="font-bold text-xs mb-4">Top 10 Drivers</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-xs mb-4">Top 10 Drainers</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: ['D1', 'D2', 'D3', 'D4', 'D5'], datasets: [{ label: 'Actual', data: [773, 402, 158, 108, 72], backgroundColor: colors.act }, { label: 'Budget', data: [631, 348, 158, 108, 0], backgroundColor: colors.bud }, { label: 'Diff', data: [142, 54, 0, 0, 72], type: 'line', borderColor: colors.diff, borderWidth: 2 }] });
            addChart('c2', 'bar', { labels: ['L1', 'L2', 'L3', 'L4', 'L5'], datasets: [{ label: 'Actual', data: [328, 113, 241, 328, 114], backgroundColor: colors.act }, { label: 'Budget', data: [2030, 205, 326, 411, 191], backgroundColor: colors.bud }, { label: 'Diff', data: [-1701, -92, -85, -83, -76], type: 'line', borderColor: colors.diff, borderWidth: 2 }] });
        }},
        { title: "Drivers & Drainers By Revenue", render: (area) => {
            area.innerHTML = `<div class="card mb-6"><h3 class="font-bold text-xs mb-4">Top 10 Revenue Drivers</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-xs mb-4">Top 10 Revenue Drainers</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: labels.customers, datasets: [{ label: 'Sales', data: [391, 383, 185, 78, 66, 65, 59, 50, 47, 28], backgroundColor: colors.act }, { label: 'Budget', data: [339, 344, 152, 49, 0, 65, 30, 28, 47, 0], backgroundColor: colors.bud }, { label: 'Diff', data: [52, 38, 32, 29, 66, 0, 30, 21, 0, 28], type: 'line', borderColor: colors.diff, borderWidth: 2 }] });
            addChart('c2', 'bar', { labels: ['C11', 'New Biz', 'C13', 'C14', 'C15'], datasets: [{ label: 'Sales', data: [164, 0, 121, 111, 213], backgroundColor: colors.act }, { label: 'Budget', data: [839, 169, 205, 186, 287], backgroundColor: colors.bud }, { label: 'Diff', data: [-674, -169, -84, -75, -73], type: 'line', borderColor: colors.diff, borderWidth: 2 }] });
        }},
        { title: "Channel Analysis", render: (area) => {
            area.innerHTML = `<div class="card mb-6"><h3 class="font-bold text-xs mb-4">Sales : Sold VS Budget</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-xs mb-4">Unit : Sold VS Budgeted</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: labels.months, datasets: [{ label: 'Sales', data: [309, 213, 349, 207, 426, 282], backgroundColor: colors.act }, { label: 'Budget', data: [368, 392, 349, 333, 325, 289], backgroundColor: colors.bud }, { label: 'LY', data: [194, 165, 185, 170, 227, 243], type: 'line', borderColor: colors.ly, borderWidth: 2 }, { label: 'Forecast', data: [300, 220, 350, 210, 410, 290], type: 'line', borderColor: colors.fc, borderDash: [5,5], borderWidth: 2 }] });
            addChart('c2', 'bar', { labels: labels.months, datasets: [{ label: 'Units', data: [503, 329, 693, 365, 656, 424], backgroundColor: colors.act }, { label: 'Budget', data: [318, 564, 343, 435, 508, 805], backgroundColor: colors.bud }, { label: 'LY', data: [503, 564, 693, 435, 508, 377], type: 'line', borderColor: colors.diff, borderWidth: 2 }] });
        }},
        { title: "Revenue vs Units Breakdown", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card"><h3 class="font-bold text-xs mb-4">Gross Revenue</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Sales YTD</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Units</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">SKU Units Distribution</h3><div class="chart-container"><canvas id="c4"></canvas></div></div>
            </div>`;
            addChart('c1', 'bar', { labels: labels.months.slice(0,6), datasets: [{ label: 'Actual', data: [307, 219, 348, 202, 427, 280], backgroundColor: colors.act }, { label: 'Budget', data: [368, 333, 283, 289, 280, 229], backgroundColor: colors.bud }] });
            addChart('c2', 'line', { labels: labels.months, datasets: [{ label: 'YTD', data: [309, 463, 873, 949, 1507, 2199, 3127, 4130], borderColor: colors.act, fill: true, backgroundColor: 'rgba(0,170,255,0.1)' }] });
            addChart('c3', 'bar', { labels: labels.months.slice(0,6), datasets: [{ label: 'Actual', data: [503, 329, 693, 365, 656, 424], backgroundColor: colors.act }, { label: 'Budget', data: [318, 564, 343, 435, 508, 424], backgroundColor: colors.bud }] });
            addChart('c4', 'pie', { labels: ['SALTED35', 'SESAME35', 'NOCON', 'Other'], datasets: [{ data: [15, 10, 10, 65], backgroundColor: colors.bars }] });
        }},
        { title: "Service Metrics", render: (area) => {
            area.innerHTML = `<div class="card mb-6"><h3 class="font-bold text-xs mb-4">Lost Sales</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-xs mb-4">OTIF Performance</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: labels.months.slice(1,11), datasets: [{ label: 'Lost £', data: [6017, 3352, 3699, 2310, 16773, 8342, 6630, 2647, 740, 57], backgroundColor: colors.bud }] });
            addChart('c2', 'bar', { labels: labels.months.slice(0,11), datasets: [{ label: 'Count', data: [116, 50, 97, 100, 105, 26, 89, 74, 71, 108, 88], backgroundColor: colors.act }] });
        }},
        { title: "Performance Trends", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Gross Revenue MTD</h4><div class="small-chart"><canvas id="t1"></canvas></div></div>
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Gross Revenue YTD</h4><div class="small-chart"><canvas id="t2"></canvas></div></div>
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Units MTD</h4><div class="small-chart"><canvas id="t3"></canvas></div></div>
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Units YTD</h4><div class="small-chart"><canvas id="t4"></canvas></div></div>
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Investment MTD</h4><div class="small-chart"><canvas id="t5"></canvas></div></div>
                <div class="card"><h4 class="text-[10px] font-bold text-gray-500 uppercase">Investment YTD</h4><div class="small-chart"><canvas id="t6"></canvas></div></div>
            </div>`;
            const opt = { plugins: { datalabels: { display: false }, legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } };
            addChart('t1', 'line', { labels: labels.months, datasets: [{ data: [3,2,4,2,5,3,4,1,2,3,2,1], borderColor: colors.act, fill: true }] }, opt);
            addChart('t2', 'line', { labels: labels.months, datasets: [{ data: [1,2,3,4,6,8,11,14,16,18], borderColor: colors.act }] }, opt);
            addChart('t3', 'bar', { labels: labels.months, datasets: [{ data: [5,3,6,4,6,4,6,2,3,4,3,2], backgroundColor: colors.bud }] }, opt);
            addChart('t4', 'line', { labels: labels.months, datasets: [{ data: [1,2,3,4,6,8,11,14,16,18], borderColor: colors.bud }] }, opt);
            addChart('t5', 'line', { labels: labels.months, datasets: [{ data: [2,2,2,1,2,3,1,2,2,3,1,1], borderColor: colors.diff }] }, opt);
            addChart('t6', 'line', { labels: labels.months, datasets: [{ data: [1,1,2,2,3,4,4,5,6,7], borderColor: colors.diff, fill: true }] }, opt);
        }},
        { title: "Customer Investment Report", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card overflow-x-auto"><h3 class="font-bold text-xs mb-4">Investment Table</h3>
                    <table class="w-full text-[11px] text-left">
                        <thead class="bg-indigo-50"><tr><th class="p-2">Code</th><th class="p-2">Account</th><th class="p-2">Amount</th></tr></thead>
                        <tbody>
                            <tr><td class="p-2">5101</td><td class="p-2">Listing Fees</td><td class="p-2">£28,668</td></tr>
                            <tr><td class="p-2">5102</td><td class="p-2">Shopper Marketing</td><td class="p-2">£141,125</td></tr>
                            <tr><td class="p-2">5107</td><td class="p-2">Meal Deal Retros</td><td class="p-2">£50,280</td></tr>
                            <tr class="font-bold border-t"><td colspan="2" class="p-2">Total</td><td class="p-2">£268,017</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="card"><h3 class="font-bold text-xs mb-4">CI Contribution</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            </div>
            <div class="card mt-6"><h3 class="font-bold text-xs mb-4">Customer Contribution Waterfall</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'doughnut', { labels: ['Shopper', 'Meal Deal', 'Listing', 'Data', 'Other'], datasets: [{ data: [52.6, 18.7, 10.7, 6.9, 11.1], backgroundColor: colors.bars }] });
            addChart('c2', 'line', { labels: labels.customers, datasets: [{ label: 'Contribution', data: [28, 27, 21, 18, 13, 12, 9, 7, 6, 5], borderColor: colors.act, fill: true }] });
        }},
        { title: "CLOGS and Customer Investment", render: (area) => {
            area.innerHTML = `<div class="card mb-6"><h3 class="font-bold text-xs mb-4">CLOGS Trend</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-xs mb-4">Customer Investment Trend</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: labels.months, datasets: [{ label: 'CLOGS', data: [171, 109, 178, 109, 203, 153], backgroundColor: colors.act }, { label: 'Budget', data: [135, 68, 149, 71, 176, 117], backgroundColor: colors.bud }, { label: 'Forecast', data: [150, 110, 160, 120, 240, 180], type: 'line', borderColor: colors.diff }] });
            addChart('c2', 'bar', { labels: labels.months, datasets: [{ label: 'Inv', data: [25, 29, 28, 21, 32, 51], backgroundColor: colors.act }, { label: 'Budget', data: [11, 23, 29, 7, 15, 32], backgroundColor: colors.bud }, { label: 'Forecast', data: [20, 25, 25, 15, 25, 45], type: 'line', borderColor: colors.diff }] });
        }},
        { title: "Customer Insights", render: (area) => {
            area.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="card"><h3 class="font-bold text-xs mb-4">Customer Volume</h3><div class="chart-container"><canvas id="c1"></canvas></div></div>
                <div class="card"><h3 class="font-bold text-xs mb-4">Channel Volume</h3><div class="chart-container"><canvas id="c2"></canvas></div></div>
            </div>
            <div class="card mt-6"><h3 class="font-bold text-xs mb-4">Product Revenue</h3><div class="chart-container"><canvas id="c3"></canvas></div></div>`;
            addChart('c1', 'bar', { labels: labels.customers, datasets: [{ label: 'Units', data: [773, 587, 544, 402, 328, 328, 241, 240, 209, 206], backgroundColor: colors.act }] }, { indexAxis: 'y' });
            addChart('c2', 'pie', { labels: ['Grocery', 'Travel', 'Foodservice', 'Other'], datasets: [{ data: [18, 15, 13, 54], backgroundColor: colors.bars }] });
            addChart('c3', 'bar', { labels: labels.skus, datasets: [{ label: 'Rev', data: [516, 511, 507, 322, 257, 189, 187, 175, 170, 166], backgroundColor: colors.bud }] });
        }}
    ];

    function changePage(delta) {
        let next = currentPage + delta;
        if (next >= 1 && next <= totalPages) {
            currentPage = next;
            renderPage();
        }
    }

    function jumpToPage(p) {
        currentPage = parseInt(p);
        renderPage();
    }

    function renderPage() {
        clear();
        const page = pageData[currentPage - 1];
        document.getElementById('pageTitle').innerText = page.title;
        document.getElementById('pageSelect').value = currentPage;
        
        document.getElementById('prevBtn').disabled = (currentPage === 1);
        document.getElementById('nextBtn').disabled = (currentPage === totalPages);
        
        page.render(document.getElementById('mainContent'));
    }

    // Init Page Options
    const sel = document.getElementById('pageSelect');
    pageData.forEach((p, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1;
        opt.innerText = `${i+1}: ${p.title}`;
        sel.appendChild(opt);
    });

    renderPage();

</script>
</body>
</html>
